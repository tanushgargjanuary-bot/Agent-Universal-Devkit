schema_version: 1

workflow:
  stages:
    - inspect
    - plan
    - approve
    - execute
    - verify
    - report
  require_plan_before_execution: true
  require_verification_before_completion: true

routing:
  select_only_tested_harness_adapters: true
  prefer_project_native_tools: true
  allow_fallback_harness: false

permissions:
  low:
    approval: false
  medium:
    approval: true
  high:
    approval: true
  critical:
    approval: true

blocked_without_human_approval:
  - install_or_upgrade_dependencies
  - change_repository_permissions
  - access_or_export_secrets
  - deploy_to_production
  - destructive_database_migration
  - delete_repository_data
  - run_untrusted_code_with_broad_permissions

verification:
  require_evidence: true
  accepted_evidence:
    - test_result
    - build_result
    - lint_result
    - security_scan
    - reviewed_diff
  agent_self_report_is_sufficient: false
