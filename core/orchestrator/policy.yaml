schema_version: 1

workflow:
  stages:
    - inspect
    - plan
    - approve
    - execute
    - verify
    - report
  require_plan_before_execution: true
  require_verification_before_completion: true

routing:
  select_only_tested_harness_adapters: true
  prefer_project_native_tools: true
  allow_fallback_harness: false

action_catalog:
  source: ./policy.rules.json
  authority: canonical_runtime_rules

verification:
  require_evidence: true
  accepted_evidence:
    - test_result
    - build_result
    - lint_result
    - security_scan
    - reviewed_diff
  agent_self_report_is_sufficient: false
