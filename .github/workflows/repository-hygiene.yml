name: Repository hygiene

on:
  push:
    paths:
      - "scripts/repository-hygiene/**"
      - "core/**"
      - "integrations/**"
      - "agents/**"
      - "schemas/**"
      - "catalog/**"
      - "knowledge/**"
      - "rubrics/**"
      - "manifest.yaml"
      - ".github/**"
      - "bootstrap/template/**"
      - ".devkit/**"
      - "README.md"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/repository-hygiene.yml"
  pull_request:
    paths:
      - "scripts/repository-hygiene/**"
      - "bootstrap/template/**"
      - ".devkit/**"
      - "README.md"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/repository-hygiene.yml"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test repository hygiene checker
        run: node --test scripts/repository-hygiene/check.test.mjs
      - name: Enforce continuity updates for changed files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/repository-hygiene/check-continuity-diff.mjs
      - name: Scan repository
        run: node scripts/repository-hygiene/check.mjs
