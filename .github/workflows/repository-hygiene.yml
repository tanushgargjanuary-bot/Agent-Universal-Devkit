name: Repository hygiene

on:
  push:
    paths:
      - "scripts/repository-hygiene/**"
      - "core/**"
      - "integrations/**"
      - "agents/**"
      - "schemas/**"
      - "catalog/**"
      - "knowledge/**"
      - "rubrics/**"
      - "manifest.yaml"
      - ".github/**"
      - "bootstrap/template/**"
      - ".devkit/**"
      - "README.md"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/repository-hygiene.yml"
  pull_request:
    paths:
      - "scripts/repository-hygiene/**"
      - "scripts/discover_trending_repositories.py"
      - "scripts/test_discover_trending_repositories.py"
      - "bootstrap/template/**"
      - ".devkit/**"
      - "README.md"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/repository-hygiene.yml"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test repository hygiene checker
        run: node --test scripts/repository-hygiene/check.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile and test trending resource discovery
        run: |
          python -m py_compile scripts/discover_trending_repositories.py
          cd scripts && python -m unittest -v test_discover_trending_repositories.py
      - name: Enforce continuity updates for changed files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/repository-hygiene/check-continuity-diff.mjs
      - name: Scan repository
        run: node scripts/repository-hygiene/check.mjs
