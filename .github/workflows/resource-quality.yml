name: Resource quality

on:
  push:
    paths:
      - "core/resource-engine/**"
      - "schemas/resource.schema.json"
      - "catalog/resources.yaml"
      - ".github/workflows/resource-quality.yml"
  pull_request:
    paths:
      - "core/resource-engine/**"
      - "schemas/resource.schema.json"
      - "catalog/resources.yaml"
      - ".github/workflows/resource-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test resource hard constraints and ranking
        working-directory: core/resource-engine
        run: npm test
