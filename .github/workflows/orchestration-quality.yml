name: Orchestration quality

on:
  push:
    paths:
      - "core/orchestrator/**"
      - "core/knowledge-engine/**"
      - "knowledge/registry.json"
      - ".github/workflows/orchestration-quality.yml"
  pull_request:
    paths:
      - "core/orchestrator/**"
      - "core/knowledge-engine/**"
      - "knowledge/registry.json"
      - ".github/workflows/orchestration-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test orchestration planning and knowledge retrieval
        working-directory: core/orchestrator
        run: npm test
