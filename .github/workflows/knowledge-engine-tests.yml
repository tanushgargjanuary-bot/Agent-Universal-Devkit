name: Knowledge Engine Tests

on:
  push:
    branches: [main]
    paths:
      - "core/knowledge-engine/**"
      - "knowledge/**"
      - ".github/workflows/knowledge-engine-tests.yml"
  pull_request:
    paths:
      - "core/knowledge-engine/**"
      - "knowledge/**"
      - ".github/workflows/knowledge-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: core/knowledge-engine
