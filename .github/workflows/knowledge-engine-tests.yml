name: Knowledge Engine Tests

on:
  push:
    branches: [main]
    paths:
      - "core/knowledge-engine/**"
      - "knowledge/**"
      - "schemas/knowledge-item.schema.json"
      - ".github/workflows/knowledge-engine-tests.yml"
  pull_request:
    paths:
      - "core/knowledge-engine/**"
      - "knowledge/**"
      - "schemas/knowledge-item.schema.json"
      - ".github/workflows/knowledge-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: core/knowledge-engine
