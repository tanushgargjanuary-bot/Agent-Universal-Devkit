name: GitHub bootstrap app tests

on:
  push:
    paths:
      - "integrations/github-app/**"
      - "bootstrap/template/**"
      - ".github/workflows/github-app-tests.yml"
  pull_request:
    paths:
      - "integrations/github-app/**"
      - "bootstrap/template/**"
      - ".github/workflows/github-app-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test bootstrap installation
        run: npm test --prefix integrations/github-app
