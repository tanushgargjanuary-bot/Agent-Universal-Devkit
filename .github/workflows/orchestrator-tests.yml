name: Orchestrator Core Tests

on:
  push:
    paths:
      - "core/orchestrator/**"
      - ".github/workflows/orchestrator-tests.yml"
  pull_request:
    paths:
      - "core/orchestrator/**"
      - ".github/workflows/orchestrator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: core/orchestrator
