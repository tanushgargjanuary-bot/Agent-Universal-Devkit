name: Resource Engine Tests

on:
  push:
    branches: [main]
    paths:
      - "core/resource-engine/**"
      - ".github/workflows/resource-engine-tests.yml"
  pull_request:
    paths:
      - "core/resource-engine/**"
      - ".github/workflows/resource-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: core/resource-engine
