name: Resource Registry Tests

on:
  push:
    branches: [main]
    paths:
      - "core/resource-registry/**"
      - ".github/workflows/resource-registry-tests.yml"
  pull_request:
    paths:
      - "core/resource-registry/**"
      - ".github/workflows/resource-registry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - name: Check syntax
        run: npm run lint
        working-directory: core/resource-registry
      - name: Run registry tests
        run: npm test
        working-directory: core/resource-registry
